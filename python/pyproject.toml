[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-mongodb"
dynamic = ["version"]
description = "MongoDB storage and memory backends for the Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MongoDB, Inc." }]
keywords = [
    "strands",
    "strands-agents",
    "mongodb",
    "atlas",
    "vector-search",
    "storage",
    "memory",
    "agent",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

# Intentionally empty. Every runtime dependency belongs to the extra that needs it, so
# `pip install strands-mongodb[storage]` never pulls vector-search machinery. A bare
# `pip install strands-mongodb` is metadata only and imports of the backends fail with an
# actionable message (see src/strands_mongodb/_extras.py).
dependencies = []

[project.optional-dependencies]
# Floor rationale: strands-agents 1.54.0 is the first release that ships every module
# `storage.py` imports at module scope. The binding one is `strands.storage.search.keyword`,
# whose `tokenize` the lexical search path calls for parity with the SDK's own
# `KeywordSearchStrategy`; that package does not exist before 1.54.0, so `import
# strands_mongodb.storage` raises `ModuleNotFoundError` on anything older. `strands.storage`
# itself and `StorageError` arrive earlier, at 1.48.0, and `strands.memory` earlier still at
# 1.44.0 — a single shared floor is used so the extras stay mutually consistent and `[all]`
# cannot resolve to a split pair.
#
# This floor read 1.48.0 for most of the package's life: the release that satisfies the two
# `strands` modules somebody checked, rather than all four this one imports from. It was verified
# by reading wheel contents for those two. It is now verified by installing it and running the suite,
# which is what the `Dependency floors` job in ci-python.yml exists to keep doing (`REQ-E-168`),
# because a floor checked by reading is a floor checked against what the reader remembered.
#
# Upper bounds are deliberately omitted, matching strands-dynamodb-storage and the official
# extension template. Confirmed as a decision on 2026-09-17 rather than left as an inheritance,
# because this repository has evidence about what the absence costs: `strands-agents` 1.56.0
# changed a protocol and turned five CI jobs red on a change this package had no part in, 26
# minutes after publication. A ceiling would have held the matrix steady and would also have hidden
# from every user resolving fresh that a published conformance claim had stopped being true. A
# package whose whole argument is that a published name should not lie about what it satisfies
# cannot buy quiet at that price. The cost is accepted, and two detectors watch for it instead: the
# weekly `sdk-compat` canary and the ordinary test matrix, both resolving latest.
#
# `pymongo` floors at 4.14.0, the release that added `AsyncMongoClient.append_metadata`, which
# `_client.py` calls on an injected client. Below it that attribute resolves through
# `__getattr__` to a `Database` of the same name, so the call raises rather than failing to
# import: a floor is the honest way to require it, since the alternative is a runtime probe whose
# only outcome is a log line about a caller's driver version. The floor was 4.12.0, inherited from
# `pymongo-search-utils` 0.3.0 rather than chosen; 4.14.0 supports Python 3.9 upward and so clears
# the 3.10 floor below.
#
# `typing-extensions` is named rather than inherited. `types.py` imports `Required` and
# `TypedDict` from it directly, since `typing.Required` is 3.11+ and the floor here is 3.10.
# strands-agents already pins it unconditionally, so this changes no resolution today; the
# floor matches theirs. A dependency we import is one we declare, because a transitive pin
# is a fact about their current release rather than a promise to us.
storage = [
    "strands-agents>=1.54.0",
    "pymongo>=4.14.0",
    "typing-extensions>=4.13.2",
]
memory = [
    "strands-agents>=1.54.0",
    "pymongo>=4.14.0",
    "typing-extensions>=4.13.2",
    # Atlas $vectorSearch / $search stage builders, maintained by MongoDB.
    "pymongo-search-utils>=0.3.0",
]
all = ["strands-mongodb[memory,storage]"]
dev = [
    "pytest>=8.0.0,<9.0.0",
    # Floor at 1.0 because `filterwarnings` below turns a DeprecationWarning into an error, and 0.26
    # calls `asyncio.get_event_loop_policy()` on every async test -- deprecated in 3.14, slated for
    # removal in 3.16. Measured: the same suite under the same filter is 915 errors on 0.26.0 and 912
    # passed on 1.4.0. The floor is load-bearing rather than tidy, which is why it is not just a ceiling
    # raise: lowering it does not merely restore noise, it stops the suite running at all.
    "pytest-asyncio>=1.0.0,<2.0.0",
    # The 90% aggregate floor is a release gate. A gate no installed tool can
    # measure is not a gate, and the scaffold declared the floor without declaring this.
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    # tests/test_ci.py parses .github/workflows/ci-python.yml, and asserting on YAML as text is what
    # AT-099 had to settle for. PyYAML is already importable in the development venv as a
    # runtime dependency of strands-agents, which is not a reason to import it: they can drop it in any
    # release, and the failure would be an ImportError in a test about workflow structure.
    "pyyaml>=6.0.0",
    # PyYAML ships no inline annotations, so mypy reports `import-untyped` on `import yaml` without this.
    # Declared rather than silenced with an override: the stubs are what let the workflow tests be checked
    # at the same strictness as everything else.
    "types-PyYAML>=6.0.0",
    # tests/test_client.py builds a real span pipeline for AT-117 / REQ-E-114 (the fourth surface a password can reach).
    # Same reason as PyYAML above: importable today only because strands-agents pins it. The floor matches
    # theirs, and `InMemorySpanExporter` has been at opentelemetry.sdk.trace.export.in_memory_span_exporter
    # across that range. This adds nothing to any runtime extra: a partner package must not bring
    # its own OTel dependency, and `dependencies`, `storage`, `memory` and `all` are all unchanged.
    "opentelemetry-sdk>=1.30.0",
    # Five test modules parse this file to check it against the workflow, the README and the examples.
    # `tomllib` is 3.11+, so on the oldest interpreter the package supports those assertions were skipped
    # -- 38 of them, which left the 3.10 job green for a different reason than the other four. `tomli` is
    # the parser `tomllib` was adopted from and its 2.x API is `tomllib`'s, so the import sites read
    # `import tomli as tomllib` and nothing downstream knows which one it got.
    #
    # Deliberately NOT marked `python_version < '3.11'`, though the import only reaches it there. mypy is
    # configured at `python_version = "3.10"`, so it reads the floor's branch of that import on every
    # interpreter; with `tomli` absent and `ignore_missing_imports` on, the module resolves to `Any` and
    # every `tomllib.load` call silently returns `Any` into a `dict[str, Any]`. A marker would make the
    # type checker wrong everywhere to keep a 15 KiB pure-Python package off four interpreters that
    # never import it. This is a dev extra: no user installs it.
    "tomli>=2.0.0",
]

[project.urls]
# The repository these point at is the one PyPI's trusted publisher is bound to, and the one a reader
# lands on from the PyPI sidebar. `mongodb`, not `mongodb-labs`: the package is supported, not a lab.
Homepage = "https://github.com/mongodb/strands-mongodb"
Repository = "https://github.com/mongodb/strands-mongodb"
Issues = "https://github.com/mongodb/strands-mongodb/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The git repo root is one level up: this is a monorepo whose `python/` directory is a
# sibling of a future `typescript/`.
root = ".."
# Release tags are `python-v0.1.0`, so the python and typescript artifacts version
# independently off the same repo.
tag_regex = "^python-v(?P<version>.+)$"
# setuptools-scm refuses a non-default `root` without a reference file; pyproject.toml is
# always next to itself.
relative_to = "pyproject.toml"
# Only reached when building from a source tree with no git metadata (e.g. a zip download).
# Deliberately unmistakable so such a build is never mistaken for a release.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_mongodb"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "README.md",
    "MIGRATION.md",
    # The reader this is for is holding a source download and deciding whether to upgrade. `AT-164`.
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.hatch.envs.default]
features = ["all"]
dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pyyaml>=6.0.0",
    "types-PyYAML>=6.0.0",
    "opentelemetry-sdk>=1.30.0",
    "tomli>=2.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
# No path arguments: an explicit path overrides `tool.ruff.include`, and the two drifted apart once
# `scripts/` was added to one and not the other. One list, in `[tool.ruff]`, is the fix.
lint = "ruff check"
format = "ruff format"
format-check = "ruff format --check"
typecheck = "mypy"
# The coverage floors are deliberately not part of `test`. `test` must stay runnable at any point
# mid-task, and a floor that fails on a half-finished module trains everyone to pass --no-cov.
# `cov` is the release gate, run in CI and at the end of a phase.
cov = [
    "pytest --cov=strands_mongodb --cov-report=term-missing --cov-report=json --cov-fail-under=90 {args}",
    "python scripts/check_module_coverage.py",
]
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
# scripts/ is included because check_module_coverage.py gates a release. A release gate that ruff
# never sees is a release gate nobody maintains.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    # The SDK's own enforcement for one house convention: %s placeholders in log calls, never an
    # f-string, so a handler can format lazily and a log aggregator sees one message shape. All ten log
    # calls in this package already passed it, which made a passing tree a coincidence rather than a gate.
    "G", # flake8-logging-format
]

[tool.ruff.lint.isort]
# `_support` is `examples/_support.py`, imported by the sibling scripts that live beside it. The
# examples are run as scripts rather than as a package, so the import is bare and ruff has no `src`
# entry that would let it infer first-party. Without this it sorts into the third-party block, above
# `strands_mongodb`, and every example file reports I001.
known-first-party = ["_support"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Tests are checked too. An unawaited coroutine or a fixture returning the wrong type is how a test
# passes while asserting nothing, and `mypy src` alone never sees it. `scripts/` gates a release.
files = ["src", "tests", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Set explicitly rather than left to the default, which pytest-asyncio warns is changing. Function
# scope is what the fixtures assume: each test gets its own client on its own loop, so the harness
# never depends on the loop-rebinding behavior that REQ-E-017 exists to provide.
asyncio_default_fixture_loop_scope = "function"
# A typo in a marker name silently produces a test that never runs under its tier and always runs
# under none. Strict mode turns that into a collection error.
addopts = "--strict-markers --strict-config"
# A deprecation is a deadline, and a deadline nobody reads is not a deadline. Until now the suite ended
# `2269 warnings` and every one of them came from `pytest_asyncio` calling an API Python is removing in
# 3.16, so a DeprecationWarning raised by this package would have arrived as line 2270 of a wall of text
# nobody scrolls to. Erroring on the category is what makes the count meaningful: it is zero, and the
# next one to appear is ours.
#
# Only `DeprecationWarning`. Not `error` for everything, because the two other warnings on file are
# neither ours nor fixable by anything this project pins: a `ResourceWarning` from a client whose loop
# closed under it, and a `PytestUnraisableExceptionWarning` from pymongo's periodic executor running as
# a weakref callback on a dead loop. A filter wide enough to catch those would redden the suite for
# somebody else's finalizer, which is how a strict setting gets turned off again a week later.
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "contract: needs a real MongoDB deployment of any kind. Gated on MONGODB_URI.",
    "integration: needs Atlas or an Atlas CLI local deployment with mongot. Gated on MONGODB_ATLAS_URI.",
    "autoembed: needs a cluster with a registered Atlas embedding model. Gated on MONGODB_AUTOEMBED_URI.",
    "compat: resolves the latest published strands-agents rather than the pinned one. CI cron only.",
    "gate: the release-gate assertion. Reordered to run last, so it sees every other outcome.",
    "example: runs a shipped examples/ script as a subprocess. Carries a tier marker for its backend.",
    "build: builds a wheel from this tree and installs it into an empty venv. Needs network, no deployment. Gated on STRANDS_MONGODB_BUILD_TIER.",
]

[tool.coverage.run]
source = ["strands_mongodb"]
branch = true
# Several tests assert on import-time behavior, which can only be observed in a fresh interpreter.
# Without parallel mode their subprocesses are unmeasured, so the lines they exercise read as
# uncovered and the per-module floor would fail on code that is in fact tested. pytest-cov sets
# COVERAGE_PROCESS_START for child processes once this is on, and combines the data files after.
parallel = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
