# Actions only.
#
# Every `uses:` in `.github/workflows/` is a third-party dependency that this repository runs with the
# permissions of the job that names it, and a pin is a promise about a moment rather than about a
# version: `REQ-E-164` pins the two actions in the publishing job to a digest, and a digest never
# moves, including away from a vulnerability. This file is what moves it. `REQ-E-166`.
#
# `cooldown` exists because the failure this guards against is a compromised release, and a compromised
# release is usually yanked within days of publication. Waiting a week before proposing an upgrade
# turns "Dependabot opened a PR the same afternoon the attacker published" into a bump that never gets
# proposed. `default-days: 7` is the shortest interval that covers the published incidents.
#
# There is deliberately no `pip` entry. This package's dependency specifiers are floors, not pins --
# `>=`, with no upper bound -- and a floor is a promise to the people who install it: "any version at
# or above this works." Raising one revokes that promise for everybody still on the older release, so
# it is a decision about the package's support window and not a maintenance chore. Nothing here should
# be able to open that PR automatically. `AT-172` asserts the absence, so deleting this paragraph and
# adding the entry fails the suite rather than passing quietly.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One PR for the whole set rather than one per action: these move together, the suite that gates
    # them is the same suite either way, and a single PR is a single CI run.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
